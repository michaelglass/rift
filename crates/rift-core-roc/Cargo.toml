[package]
name = "rift-core-roc"
version = "0.1.0"
edition = "2024"
description = "Rift's core written in Roc (roc/core), behind rift-core's Core trait"
license = "Apache-2.0"
build = "build.rs"

# Excluded from rift's workspace (so it builds standalone): building it needs the Roc
# nightly, which rift's own build must not. rift's `roc-core` feature depends on it.

[dependencies]
rift-core = { path = "../rift-core" }

[dev-dependencies]
rift-core = { path = "../rift-core", features = ["serde"] }
serde_json = "1.0.145"

