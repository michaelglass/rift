[package]
name = "rift-core-roc"
version = "0.1.0"
edition = "2024"
description = "Rift's core written in Roc (roc/core), behind rift-core's Core trait"
license = "Apache-2.0"
build = "build.rs"

# Its own workspace: building it needs the Roc nightly, which rift's own build must not.
[workspace]

[dependencies]
rift-core = { path = "../rift-core" }

[dev-dependencies]
rift-core = { path = "../rift-core", features = ["serde"] }
serde_json = "1.0.145"

[profile.release]
debug = "line-tables-only"
