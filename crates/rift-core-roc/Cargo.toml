[package]
name = "rift-core-roc"
version = "0.1.0"
edition = "2024"
description = "Rift's core written in Roc (roc/core), stepped like rift-core's RustCore"
license = "Apache-2.0"
build = "build.rs"

# Its own workspace, outside rift's: building it needs the Roc nightly, which rift's own
# build must not.
[workspace]

[dependencies]
rift-core = { path = "../rift-core" }

