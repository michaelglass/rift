# The Roc fork's commands. `mise run check` is the full check run; `mise run roc-bump` moves the
# pinned Roc nightly (roc/NIGHTLY) to the newest one and runs the check run (docs/roc-fork.md,
# "Roc nightly policy").
[tasks.check]
description = "The full check run: fmt, check, tests, the Roc differentials, fuzzers, clippy"
run = "roc/check.sh"

[tasks.roc-bump]
description = "Bump the pinned Roc nightly to the newest, then run the check run"
run = "roc/bump.sh"

# What an install or QA build runs first (the owner's install script refuses on a failure): the
# check run itself. Every Roc build is optimized (the dev backend was rejected, docs/roc-fork.md),
# so a release build's Roc is the one the check run tests; a second gate would test nothing new.
[tasks.check-release]
description = "Before an install or QA build: the full check run (an alias of check)"
depends = ["check"]
